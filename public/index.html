<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RAP – Rise and Prosper | Bank that helps you prosper</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/rap.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Theme init: runs before React mounts to avoid flash of wrong theme -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('rap-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
        else document.documentElement.setAttribute('data-theme','light');
      } catch(e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/dist/app.bundle.js"></script>
</body>
</html>
